name: 9to5 AI Agent

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs by a few minutes.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Discover new jobs"
        type: boolean
        default: true
      apply:
        description: "Submit applications for users with auto-submit on"
        type: boolean
        default: true
      apply_dry_run:
        description: "Fill forms but do NOT submit (testing)"
        type: boolean
        default: false
      only_user:
        description: "Only run for this user id (optional)"
        type: string
        default: ""

concurrency:
  group: 9to5-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run agent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free backup AI when Gemini runs out (optional): console.groq.com / openrouter.ai
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          # "Connect with Google" inboxes: refreshes Gmail access for reply tracking and emailed codes.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_REPO_PUBLIC: ${{ github.event.repository.private == false }}
          DISCOVER: ${{ github.event.inputs.discover || 'true' }}
          APPLY: ${{ github.event.inputs.apply || 'true' }}
          APPLY_DRY_RUN: ${{ github.event.inputs.apply_dry_run || 'false' }}
          ONLY_USER: ${{ github.event.inputs.only_user }}
          # Stop starting new applications after this many minutes (job timeout is 55).
          RUN_BUDGET_MIN: "42"
          # Screenshot + page text of every application that didn't go through (kept 3 days).
          APPLY_DEBUG_DIR: debug
        run: npx tsx agent/v2/run.ts

      - name: Keep evidence of applications that didn't go through
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-debug
          path: debug
          retention-days: 3
          if-no-files-found: ignore
