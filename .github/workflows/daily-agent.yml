name: 9to5 AI Agent
# "Your run" = started for one person (Run now / chat); the app tells the two lanes apart by this name.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.only_user != '' && 'Your run' || 'Scheduled run' }}

on:
  schedule:
    # Every 2 hours (UTC); a run with jobs left starts the next one itself. GitHub may delay scheduled runs.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Discover new jobs"
        type: boolean
        default: true
      apply:
        description: "Submit applications for users with auto-submit on"
        type: boolean
        default: true
      apply_dry_run:
        description: "Fill forms but do NOT submit (testing)"
        type: boolean
        default: false
      only_user:
        description: "Only run for this user id (optional)"
        type: string
        default: ""

# The agent may start one follow-up run itself when it ran out of time with jobs still waiting.
permissions:
  contents: read
  actions: write

# Two lanes: the schedule (and its follow-ups) in one, each person's own "Run now" / chat runs in another,
# so asking the agent for something never waits behind — or stops — a 2.5-hour scheduled run.
# Both lanes claim each job before applying (applications.applying_until), so they never send the same one.
concurrency:
  group: 9to5-agent-${{ github.event_name == 'workflow_dispatch' && inputs.only_user || 'auto' }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Public repo: unlimited minutes, so runs go up to ~2.5 h. A private repo's run stops itself at 42 min.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4

      # Scheduled runs don't carry the repository in their event, so ask GitHub. Unknown counts as public
      # (logs stay hidden, no form screenshots uploaded).
      - name: Repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api repos/${{ github.repository }} --jq 'if .private then "false" else "true" end' 2>/dev/null || echo true)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run agent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free backup AI when Gemini runs out (optional): console.groq.com / openrouter.ai
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
          # "Connect with Google" inboxes: refreshes Gmail access for reply tracking and emailed codes.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_PUBLIC: ${{ steps.vis.outputs.public }}
          DISCOVER: ${{ github.event.inputs.discover || 'true' }}
          APPLY: ${{ github.event.inputs.apply || 'true' }}
          APPLY_DRY_RUN: ${{ github.event.inputs.apply_dry_run || 'false' }}
          ONLY_USER: ${{ github.event.inputs.only_user }}
          # Stop starting new applications after this many minutes (job timeout is 175).
          RUN_BUDGET_MIN: ${{ steps.vis.outputs.public == 'false' && '42' || '150' }}
          # Applications filled at the same time (different sites).
          APPLY_CONCURRENCY: ${{ steps.vis.outputs.public == 'false' && '4' || '6' }}
          # Screenshot + page text of every application that didn't go through (kept 3 days).
          # Private repo only: on a public repo anyone could download them (they show your filled-in forms).
          APPLY_DEBUG_DIR: ${{ steps.vis.outputs.public == 'false' && 'debug' || '' }}
        run: npx tsx agent/v2/run.ts

      - name: Keep evidence of applications that didn't go through
        if: always() && steps.vis.outputs.public == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: apply-debug
          path: debug
          retention-days: 3
          if-no-files-found: ignore
